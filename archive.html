<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全部主題 — 名句日日聽</title>
<meta name="description" content="名句日日聽 365 個主題總覽：12 大類，每天 5 句中西名言，聽力練習與白話解釋。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%231c1c1c'/%3E%3Ccircle cx='44' cy='20' r='8' fill='%23c23a2b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>名句<span>日日</span>聽</h1>
    <nav><a href="./">回今天</a></nav>
  </header>
  <p class="hint">365 個主題依類別分組，點任一張卡片即可練習。</p>
  <div id="groups"></div>
</div>
<script type="module">
import { todayIndex } from './js/day.js';
import { bgFor, setPageBg } from './js/cats.js';
setPageBg('bg/generic.webp');
const scenes = await (await fetch('data/scenes.json')).json();
const today = todayIndex();
const groups = new Map();
for (const x of scenes) { if (!groups.has(x.category)) groups.set(x.category, []); groups.get(x.category).push(x); }
const root = document.getElementById('groups');
for (const [cat, list] of groups) {
  const g = document.createElement('section'); g.className = 'group';
  g.innerHTML = `<div class="banner"><h3>${cat}<small>${list.length} 個主題</small></h3></div><div class="grid"></div>`;
  g.querySelector('.banner').style.backgroundImage = `url("${bgFor(cat)}")`;
  const grid = g.querySelector('.grid');
  for (const x of list) {
    const a = document.createElement('a'); a.href = `./?d=${x.id}`;
    a.className = x.id === today ? 'today' : '';
    const id3 = String(x.id).padStart(3, '0');
    a.innerHTML = `<span class="thumb"><img loading="lazy" alt="" src="img/${id3}.webp" onerror="this.parentNode.classList.add('missing');this.remove()"></span><span class="txt"><small>第 ${x.id} 天</small><b></b><i></i></span>`;
    a.querySelector('b').textContent = x.title_zh; a.querySelector('i').textContent = x.lines[0].author + ' 等';
    grid.appendChild(a);
  }
  root.appendChild(g);
}
</script>
<script src="js/vendor/gc-config.js"></script>
<script async src="js/vendor/count.js"></script>
</body>
</html>
